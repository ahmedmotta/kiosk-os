<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #f6f7fb; font-family: system-ui, sans-serif; color: #1d2340; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .ring { width: 38px; height: 38px; border-radius: 50%; border: 4px solid #d7dcef; border-top-color: #3656d4; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  p { margin: 0; font-size: 15px; color: #4a5173; }
</style>
</head>
<body>
  <div class="ring" aria-hidden="true"></div>
  <h1>Can't reach this page right now</h1>
  <p>Check the Wi‑Fi. Trying again automatically…</p>
</body>
</html>
